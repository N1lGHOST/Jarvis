name: Build APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Set APK version
        run: echo "VC=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build installable debug APK
        run: gradle assembleDebug --no-daemon -PversionCode="$VC" -PversionName="0.4.$VC"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-apk-${{ github.run_number }}-${{ github.run_attempt }}
          name: Jarvis APK build ${{ github.run_number }}
          body: |
            APK de test compilé depuis `${{ github.ref_name }}`.

            Cette version est signée avec la clé de débogage Android. Elle est installable, mais ne convient pas à une publication Play Store et une prochaine compilation peut nécessiter de désinstaller cette version avant la mise à jour.
          prerelease: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          make_latest: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          files: app/build/outputs/apk/debug/app-debug.apk
